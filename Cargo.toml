[package]
name = "piddigger"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Blue-team TUI for forensic investigation of a running Linux process"
authors = ["Kawaiipantsu / THUGS(red)"]
homepage = "https://thugs.red"
repository = "https://github.com/kawaiipantsu/piddigger"
license = "MIT"
readme = "README.md"
keywords = ["forensics", "dfir", "procfs", "tui", "blue-team"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
